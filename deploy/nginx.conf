# PokéSurvivor trên nginx (bên trong container). File Dockerfile dùng file này.
# Cẩn thận với cache: chính nó làm cho việc tự động cập nhật
# (js/core/updater.js -> version.json) có hiệu lực ngay lập tức.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Redirect trả về dạng tương đối (/pokedex/): hoạt động giống nhau
    # phía sau Traefik, khi dùng port riêng hay dùng domain thật.
    absolute_redirect off;

    # JS đã obfuscate và các file từ điển khá nặng: nên nén lại.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml application/xml;

    # ---------- Không cache những thứ hay thay đổi ----------

    # Updater gọi file này mỗi 5 phút: nếu bị cache thì không ai biết có bản mới.
    location = /version.json {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    # Nếu index.html bị cũ, game sẽ gọi app.min.js với mã hash (huella)
    # không còn tồn tại (và updater sẽ reload lặp vô hạn).
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Service worker phải có thể tự cập nhật.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # ---------- Những thứ không bao giờ thay đổi ----------

    # Sprite, icon và font: cache 1 năm.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # js/ và css/ được gọi kèm ?v=<huella> (do build.js sinh ra): cache 1 tuần được.
    location ~* ^/(js|css)/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # ---------- Các trang ----------

    location / {
        add_header Cache-Control "no-cache";
        # Các trang SEO dùng đường dẫn tương đối (../css/pages.css): thư mục không có
        # dấu / ở cuối sẽ được redirect, /pokedex -> /pokedex/ (giống GitHub Pages trước đây).
        if (-d $request_filename) {
            rewrite ^(.*[^/])$ $1/ permanent;
        }
        try_files $uri $uri/ $uri.html =404;
    }

    # Đúng MIME type cho manifest của PWA.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    error_page 404 /404.html;

    # Chặn file ẩn (.git, .env...).
    location ~ /\. {
        deny all;
    }
}
